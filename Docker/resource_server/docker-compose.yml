---
services:
  ethoscope-resources:
    build: .
    image: ethoscope-resources
    container_name: ethoscope-resources
    restart: always
    expose:
      - 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
#      - ./:/opt/ethoscope_resources
      - ./contents:/opt/ethoscope_resources/contents
      # Published SD images live here; pa_server.py reads their .json manifests
      # to build the image list. Written by accessories/publish-image.sh and
      # served to the world by the image_server container.
      - ${ETHOSCOPE_IMAGES_DIR:-/srv/http/ethoscope/images}:/opt/ethoscope_resources/images:ro

networks:
  default:
    name: intranet
    external: true
